name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  # SHA-256 of the release signing certificate; the build must be signed with exactly this key.
  EXPECTED_CERT_SHA256: 32720a0b30a3856a966ada931c917d1465184bde92a5aeebd01f5e36792b8665

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Validate tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "Tag '$TAG' is not vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-rc.N" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0"
      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.MINEMAPS_KEYSTORE_BASE64 }}
        run: |
          umask 077
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "MINEMAPS_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Test and build release APK
        env:
          MINEMAPS_KEYSTORE_PASSWORD: ${{ secrets.MINEMAPS_KEYSTORE_PASSWORD }}
          MINEMAPS_KEY_ALIAS: ${{ secrets.MINEMAPS_KEY_ALIAS }}
          MINEMAPS_KEY_PASSWORD: ${{ secrets.MINEMAPS_KEY_PASSWORD }}
          TAG: ${{ github.ref_name }}
        run: |
          MINEMAPS_VERSION="${TAG#v}" ./gradlew :mapengine:test :app:testDebugUnitTest :app:assembleRelease
      - name: Verify APK
        env:
          TAG: ${{ github.ref_name }}
        run: tools/ci/verify-apk.sh app/build/outputs/apk/release/app-release.apk "${TAG#v}" "$EXPECTED_CERT_SHA256"
      - name: Package
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/MineMaps-$TAG.apk"
          (cd dist && sha256sum "MineMaps-$TAG.apk" > "MineMaps-$TAG.apk.sha256")
          cat "dist/MineMaps-$TAG.apk.sha256"
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=()
          if [[ "$TAG" == *-rc.* ]]; then flags+=(--prerelease); fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "dist/MineMaps-$TAG.apk" "dist/MineMaps-$TAG.apk.sha256" --clobber
          else
            gh release create "$TAG" "dist/MineMaps-$TAG.apk" "dist/MineMaps-$TAG.apk.sha256" --title "MineMaps $TAG" --generate-notes --verify-tag "${flags[@]}"
          fi
      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
